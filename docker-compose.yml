services:
  telemetry-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: death-relapse-telemetry-proxy
    env_file:
      - .env
    ports:
      - "8080:8080"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3); exit(0 if r.status == 200 else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
